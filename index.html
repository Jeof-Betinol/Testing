<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Page</title>

    <link rel="stylesheet" href="Form.css">
    <script src="Jav.js" defer></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    
    <div class="Container">
        <form id="signupForm">
            <h2>Reservation</h2>

            <label for="Fname">First Name</label>
            <input type="text" id="Fname" placeholder="Enter first name" required>

            <label for="Lname">Last Name</label>
            <input type="text" id="Lname" placeholder="Enter Last name" required>

            <label for="Email">Email Address</label>
            <input type="email" id="Email" placeholder="Enter email address" required>

            <label for="Rdate">Reservation Date</label>
            <input type="date" id="Rdate" required>

            <label for="Rtime">Reservation Time</label>
            <select id="Rtime" required>
                <option value="">Select Time</option>
                 <option>09:00 AM</option>
                 <option>09:30 AM</option>
                 <option>10:00 AM</option>
                 <option>10:30 AM</option>
                 <option>11:00 AM</option>
                 <option>11:30 AM</option>
                 <option>12:30 PM</option>
                 <option>1:00 PM</option>
                 <option>1:30 PM</option>
                 <option>2:00 PM</option>
                 <option>2:30 PM</option>
                 <option>3:00 PM</option>
                 <option>3:30 PM</option>
                 <option>4:00 PM</option>
                 <option>4:30 PM</option>
                 <option>5:00 PM</option>
                 <option>5:30 PM</option>
            </select>
            <br>
            <button type="submit" id="Sbutton">Reserve</button>

            <p id="message"></p>

        </form>
                <div class="SuccessBox" id="SuccessBox">    
                    <h2>Reservation Sent!</h2>

                 <p class="reserve-text">Reservation Number</p>

                  <div class="reserve-number" id="reserveNumber">
                
            </div>

            <button type="click" id="confirmBtn">Confirm!</button>
        </div>
    </div>

</body>
</html>
